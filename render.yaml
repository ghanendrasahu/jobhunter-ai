# Render blueprint for jobhunter-ai.
# Mirrors the live service configuration; inert until an explicit Blueprint Sync.
# Secret values are declared with sync:false and stay in the Render dashboard.
services:
- type: web
  name: jobhunter-ai
  runtime: python
  plan: free
  region: oregon
  branch: main
  buildCommand: pip install -r requirements.txt && pip install --no-deps -e .
  startCommand: sh -c "jobhunter-web --server.port=${PORT:-10000} --server.address=0.0.0.0 --server.headless=true"
  healthCheckPath: /_stcore/health
  autoDeploy: true
  envVars:
  - key: ADZUNA_API_KEY
    sync: false
  - key: ADZUNA_APP_ID
    sync: false
  - key: GROQ_API_KEY
    sync: false
  - key: GROQ_MODEL
    value: openai/gpt-oss-20b
  - key: OPENAI_API_KEY
    sync: false
  - key: PYTHON_VERSION
    value: 3.11.12
