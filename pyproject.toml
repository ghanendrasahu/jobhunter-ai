[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobhunter-ai"
version = "3.0.0"
description = "Resume-driven Indian job search, matching, and application tracking."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pypdf==5.4.0",
    "requests==2.32.5",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.18",
    "langgraph==1.2.7",
    "langchain-openai==1.4.0",
    "langchain-core==1.5.0",
    "openai>=2.45.0",
    "pydantic-settings==2.14.1",
    "httpx==0.28.1",
    "playwright>=1.40.0",
    "streamlit>=1.28.0",
    "plotly>=5.18.0",
    "pandas>=2.0.0",
    "fastapi==0.115.11",
    "uvicorn[standard]==0.34.2",
    "slowapi==0.1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
jobhunter = "jobhunter.cli:main"
jobhunter-web = "jobhunter.web:main"
jobhunter-scheduler = "jobhunter.scheduler:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true