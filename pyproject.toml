[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobhunter-ai"
version = "3.0.0"
description = "Resume-driven Indian job search, matching, and application tracking."
readme = "README.md"
requires-python = "~=3.11.0"
license = { text = "MIT" }
dependencies = [
    "pypdf==6.15.0",
    "requests==2.32.5",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.32",
    "langgraph==1.2.11",
    "langchain-openai==1.4.3",
    "langchain-core==1.5.4",
    "openai==2.54.0",
    "pydantic-settings==2.14.1",
    "httpx==0.28.1",
    "playwright==1.62.0",
    "streamlit==1.61.1",
    "plotly==6.9.0",
    "pandas==3.0.5",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.2",
    "slowapi==0.1.10",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.15.15",
    "mypy==2.1.0",
]

[project.scripts]
jobhunter = "jobhunter.cli:main"
jobhunter-web = "jobhunter.web:main"
jobhunter-scheduler = "jobhunter.scheduler:main"
jobhunter-apply = "jobhunter.automation.apply:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true