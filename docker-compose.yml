services:
  jobhunter:
    build: .
    container_name: jobhunter-ai
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./history:/app/history
      - ./resumes:/app/resumes
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.5"
    restart: unless-stopped
